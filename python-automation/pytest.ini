[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: critical-path smoke tests
    regression: full regression suite
    ui: Selenium UI tests
    api: API tests via requests
    db: direct MongoDB tests
    security: security-focused tests
    responsive: viewport/responsive tests
    cross_browser: tests meant to run on multiple browsers
log_cli = false
addopts = -ra
